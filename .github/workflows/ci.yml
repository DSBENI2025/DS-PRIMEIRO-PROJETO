name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          MERCADO_PAGO_ACCESS_TOKEN: TEST_TOKEN
          MERCADO_PAGO_WEBHOOK_SECRET: TEST_SECRET
          MERCADO_PAGO_PLAN_ID: TEST_PLAN
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: TEST_ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY: TEST_SERVICE_ROLE
          GOOGLE_CLIENT_ID: TEST_GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET: TEST_GOOGLE_CLIENT_SECRET
          GOOGLE_TOKEN_ENCRYPTION_KEY: test-encryption-key-32-characters-minimum
          TOKEN_ENCRYPTION_KEY: test-server-encryption-key-32-characters-minimum
          MERCADO_PAGO_CLIENT_ID: TEST_MP_CLIENT_ID
          MERCADO_PAGO_CLIENT_SECRET: TEST_MP_CLIENT_SECRET
