name: Generate Supabase Baseline

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect Supabase migration command
        run: npx --yes supabase@latest migration new --help

      - name: Generate baseline migration
        run: |
          if ! ls supabase/migrations/*_initial_schema.sql >/dev/null 2>&1; then
            npx --yes supabase@latest migration new initial_schema
            file="$(ls -t supabase/migrations/*_initial_schema.sql | head -1)"
            cp supabase/schema.sql "$file"
          fi

      - name: Commit baseline migration
        run: |
          if git status --porcelain supabase/migrations | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/migrations
            git commit -m "chore: add Supabase baseline migration"
            git push origin HEAD:${{ github.head_ref }}
          fi
