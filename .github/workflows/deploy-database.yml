name: Deploy Supabase migrations

on:
  workflow_dispatch:

concurrency:
  group: agenda-pro-supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Verify Supabase credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "SUPABASE_ACCESS_TOKEN missing" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "SUPABASE_DB_PASSWORD missing" && exit 1)
          test -n "$SUPABASE_PROJECT_ID" || (echo "SUPABASE_PROJECT_ID missing" && exit 1)

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply pending migrations
        run: supabase db push

      - name: Verify migration history
        shell: bash
        run: |
          supabase migration list
          echo "### Agenda Pro database migration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $SUPABASE_PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pending migrations were applied with supabase db push." >> "$GITHUB_STEP_SUMMARY"
