name: Process WhatsApp reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Process reminder queue
        env:
          BASE_URL: ${{ secrets.AGENDA_PRO_BASE_URL }}
          CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Notification scheduler secrets are not configured."
            exit 0
          fi

          curl --fail --silent --show-error             --request POST             --header "Authorization: Bearer $CRON_SECRET"             "${BASE_URL%/}/api/notifications/process"
